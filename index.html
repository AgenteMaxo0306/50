<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Data + RA - Realidad Aumentada por Marcador</title>
    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Tailwind para la interfaz -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="bg-black text-white select-none">

    <!-- Pantalla de instrucciones inicial -->
    <div id="ui-screen" class="absolute inset-x-0 bottom-6 z-50 flex flex-col items-center pointer-events-none px-4">
        <div class="bg-gray-900/90 border border-cyan-500/40 backdrop-blur-md px-6 py-3 rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.3)] pointer-events-auto text-center max-w-sm">
            <h1 class="text-xs font-bold text-cyan-300 uppercase tracking-wider mb-1">Escáner AR Activo</h1>
            <p class="text-[11px] text-gray-300 mb-3">Apunta con la cámara de tu celular hacia el marcador <strong>Hiro</strong> (o tu patrón configurado) para visualizar la maqueta 3D.</p>
            <div class="flex gap-2 justify-center">
                <a href="https://ar-js-org.github.io/AR.js/three.js/examples/marker-training/examples/generator.html" target="_blank" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-[10px] font-medium transition-all shadow">
                    Generar / Ver Marcador
                </a>
            </div>
        </div>
    </div>

    <!-- Escena de Realidad Aumentada (AR.js + A-Frame) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false">
        
        <!-- Marcador de seguimiento (Por defecto usa el marcador 'hiro' clásico de AR.js, ideal para pruebas rápidas) -->
        <a-marker preset="hiro">
            
            <!-- Contenido 3D que aparecerá ENCIMA del marcador al enfocarlo -->
            <a-entity position="0 0.5 0" rotation="0 0 0">
                
                <!-- Base de servidores / Maqueta 3D geométrica simulada -->
                <a-box position="0 0.2 0" depth="1.5" height="0.4" width="1.5" color="#0f172a" material="metalness: 0.8; roughness: 0.2; emissive: #0044aa; emissiveIntensity: 0.3;"></a-box>
                
                <!-- Servidores centrales -->
                <a-box position="-0.4 0.6 -0.4" depth="0.3" height="0.8" width="0.3" color="#00ffff"></a-box>
                <a-box position="0.4 0.6 -0.4" depth="0.3" height="0.8" width="0.3" color="#00ffff"></a-box>
                <a-box position="-0.4 0.6 0.4" depth="0.3" height="0.8" width="0.3" color="#3b82f6"></a-box>
                <a-box position="0.4 0.6 0.4" depth="0.3" height="0.8" width="0.3" color="#3b82f6"></a-box>

                <!-- Núcleo de Esfera Central flotante (Big Data) -->
                <a-sphere position="0 1.2 0" radius="0.45" color="#00ffff" material="wireframe: true; emissive: #00ffff; emissiveIntensity: 0.8;" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;"></a-sphere>

                <!-- Anillo orbital animado -->
                <a-torus position="0 1.2 0" radius="0.7" radius-tubular="0.015" rotation="65 0 0" color="#3b82f6" material="emissive: #3b82f6; emissiveIntensity: 0.8;" animation="property: rotation; to: 65 360 0; loop: true; dur: 5000; easing: linear;"></a-torus>

                <!-- Texto flotante en 3D -->
                <a-text value="BIG DATA + RA" position="-0.8 1.9 0" scale="0.6 0.6 0.6" color="#00ffff"></a-text>

            </a-entity>
        </a-marker>

        <!-- Cámara de la experiencia AR -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
