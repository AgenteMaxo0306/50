<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Data + RA - Visor Directo</title>
    <!-- Three.js para gráficos 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: system-ui, sans-serif; 
        }
        /* Contenedor de la cámara a pantalla completa real */
        #camera-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            background: #000;
        }
        #webcam {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
        #canvas-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <!-- Video de la cámara -->
    <div id="camera-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- Lienzo 3D -->
    <div id="canvas-container"></div>

    <!-- Script para iniciar la cámara automáticamente -->
    <script>
        const video = document.getElementById('webcam');
        let scene, camera, renderer, holoMesh;

        // Iniciar la cámara de inmediato al cargar la página
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                initThreeJS();
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                alert("Por favor, permite el acceso a la cámara y asegúrate de usar HTTPS o Localhost.");
            }
        }

        function initThreeJS() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Luz ambiental
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            // Crear un plano holográfico tecnológico interactivo (estilo interfaz Big Data)
            const geometry = new THREE.PlaneGeometry(3.2, 2.0);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, 
                wireframe: true,
                transparent: true,
                opacity: 0.7
            });
            
            holoMesh = new THREE.Mesh(geometry, material);
            scene.add(holoMesh);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (holoMesh) {
                holoMesh.rotation.y += 0.005; // Rotación suave flotante
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Ejecutar al cargar
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
