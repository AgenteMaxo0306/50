<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Data + RA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: system-ui, sans-serif; 
        }
        #video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: 1; 
        }
        #canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 2; 
            pointer-events: none; 
        }
        #overlay-tap { 
            position: fixed; 
            inset: 0; 
            z-index: 10; 
            background: rgba(3, 7, 18, 0.95); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-align: center; 
            padding: 24px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <!-- Video de la cámara en tiempo real -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Canvas para los gráficos 3D -->
    <canvas id="canvas"></canvas>

    <!-- Pantalla obligatoria de toque (Requerido por los navegadores móviles para autorizar la cámara) -->
    <div id="overlay-tap">
        <div style="background: #0f172a; border: 1px solid rgba(6,182,212,0.4); border-radius: 20px; padding: 32px; max-width: 320px; width: 100%; box-shadow: 0 0 30px rgba(6,182,212,0.2);">
            <div style="font-size: 36px; margin-bottom: 16px;">📷</div>
            <h2 style="font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #22d3ee;">Toca para Iniciar Cámara</h2>
            <p style="font-size: 12px; color: #94a3b8; line-height: 1.5;">Haz clic en cualquier parte de este recuadro para encender la cámara y visualizar la experiencia 3D.</p>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay-tap');
        const video = document.getElementById('video');
        let renderer, scene, camera, techMesh;

        overlay.addEventListener('click', async () => {
            try {
                // Solicitar la cámara trasera del dispositivo móvil
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                
                video.srcObject = stream;
                
                // Ocultar la pantalla de toque suavemente
                overlay.style.opacity = '0';
                overlay.style.transition = 'opacity 0.4s ease';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 400);

                initThreeJS();
            } catch (err) {
                console.error(err);
                alert("No se pudo acceder a la cámara. Asegúrate de abrir la página mediante HTTPS o Localhost.");
            }
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.5;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const light = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(light);

            // Estructura 3D flotante con temática tecnológica
            const geometry = new THREE.BoxGeometry(2.2, 1.4, 0.2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            techMesh = new THREE.Mesh(geometry, material);
            scene.add(techMesh);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (techMesh) {
                techMesh.rotation.y += 0.006;
                techMesh.rotation.x = Math.sin(Date.now() * 0.001) * 0.15;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
