<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Data + RA</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: system-ui, sans-serif; 
        }
        /* Video de la cámara a pantalla completa */
        #video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: 1; 
        }
        /* Canvas para los gráficos 3D */
        #canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 2; 
            pointer-events: none; 
        }
        /* Pantalla obligatoria de toque (Requerido por navegadores móviles) */
        #overlay-tap { 
            position: fixed; 
            inset: 0; 
            z-index: 10; 
            background: rgba(3, 7, 18, 0.98); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-align: center; 
            padding: 24px; 
            cursor: pointer; 
            transition: opacity 0.5s ease;
        }
        .tap-box {
            background: #0f172a; 
            border: 1px solid rgba(6,182,212,0.5); 
            border-radius: 20px; 
            padding: 40px; 
            max-width: 340px; 
            width: 100%; 
            box-shadow: 0 0 40px rgba(6,182,212,0.3);
        }
    </style>
</head>
<body>

    <!-- Video de la cámara en tiempo real -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Canvas para los gráficos 3D -->
    <canvas id="canvas"></canvas>

    <!-- Pantalla de toque obligatoria (evita el bloqueo del navegador) -->
    <div id="overlay-tap">
        <div class="tap-box">
            <div style="font-size: 48px; margin-bottom: 20px;">📷</div>
            <h2 style="font-size: 22px; font-weight: bold; margin-bottom: 12px; color: #22d3ee;">Activar Cámara</h2>
            <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">Toca en cualquier lugar para iniciar la cámara y visualizar la experiencia interactiva de Big Data.</p>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay-tap');
        const video = document.getElementById('video');
        let renderer, scene, camera, techMesh;

        // Esta función se ejecuta al tocar la pantalla
        overlay.addEventListener('click', async () => {
            try {
                // 1. Solicitar acceso a la cámara trasera preferentemente
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: 'environment' }, // Intenta usar la cámara trasera
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    },
                    audio: false
                });
                
                // 2. Asignar el stream de video al elemento <video>
                video.srcObject = stream;
                
                // 3. Ocultar la pantalla de toque
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);

                // 4. Iniciar el entorno 3D
                initThreeJS();
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                alert("No se pudo acceder a la cámara. Asegúrate de abrir esta página mediante HTTPS (por ejemplo, usando GitHub Pages).");
            }
        });

        function initThreeJS() {
            // Crear la escena
            scene = new THREE.Scene();
            
            // Crear la cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.5;

            // Configurar el renderizador transparente sobre el video
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'), 
                alpha: true, 
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Añadir luz
            const light = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(light);

            // Crear un objeto 3D con estilo tecnológico
            const geometry = new THREE.BoxGeometry(2.0, 1.2, 0.2);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                wireframe: true,
                emissive: 0x00ffff,
                emissiveIntensity: 0.5
            });
            techMesh = new THREE.Mesh(geometry, material);
            scene.add(techMesh);

            // Manejar el cambio de tamaño de ventana/orientación móvil
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Animación de rotación del objeto 3D
            if (techMesh) {
                techMesh.rotation.y += 0.006;
                techMesh.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;
            }
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
