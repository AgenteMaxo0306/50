<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Data + RA - Maqueta 3D</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: system-ui, sans-serif; 
        }
        #video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: 1; 
        }
        #canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 2; 
            pointer-events: none; 
        }
        #overlay-tap { 
            position: fixed; 
            inset: 0; 
            z-index: 10; 
            background: rgba(3, 7, 18, 0.98); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-align: center; 
            padding: 24px; 
            cursor: pointer; 
            transition: opacity 0.5s ease;
        }
        .tap-box {
            background: #0f172a; 
            border: 1px solid rgba(6,182,212,0.5); 
            border-radius: 20px; 
            padding: 40px; 
            max-width: 340px; 
            width: 100%; 
            box-shadow: 0 0 40px rgba(6,182,212,0.3);
        }
    </style>
</head>
<body>

    <!-- Video de la cámara en tiempo real -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Canvas para los gráficos 3D -->
    <canvas id="canvas"></canvas>

    <!-- Pantalla de toque obligatoria -->
    <div id="overlay-tap">
        <div class="tap-box">
            <div style="font-size: 48px; margin-bottom: 20px;">🌐</div>
            <h2 style="font-size: 22px; font-weight: bold; margin-bottom: 12px; color: #22d3ee;">Activar Experiencia 3D</h2>
            <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">Toca en cualquier lugar para iniciar la cámara y proyectar tu maqueta.</p>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay-tap');
        const video = document.getElementById('video');
        let renderer, scene, camera, imageMesh;

        overlay.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: 'environment' }, 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);

                initThreeJS();
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                alert("No se pudo acceder a la cámara. Asegúrate de usar HTTPS.");
            }
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.0;

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'), 
                alpha: true, 
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const light = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(light);

            // Carga directa de la imagen 'maqueta.jpg' que está en tu repositorio
            const textureLoader = new THREE.TextureLoader();
            
            textureLoader.load(
                'maqueta.jpg', 
                (texture) => {
                    const geometry = new THREE.PlaneGeometry(3.2, 2.0);
                    const material = new THREE.MeshBasicMaterial({ 
                        map: texture, 
                        side: THREE.DoubleSide,
                        transparent: true
                    });
                    imageMesh = new THREE.Mesh(geometry, material);
                    scene.add(imageMesh);
                },
                undefined,
                (error) => {
                    console.error("Error al cargar la imagen:", error);
                    // Respaldo por si hay algún problema con la ruta
                    const geometry = new THREE.PlaneGeometry(2.6, 1.6);
                    const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
                    imageMesh = new THREE.Mesh(geometry, material);
                    scene.add(imageMesh);
                }
            );

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (imageMesh) {
                // Sutil rotación y efecto flotante tridimensional
                imageMesh.rotation.y += 0.003;
                imageMesh.rotation.x = Math.sin(Date.now() * 0.001) * 0.06;
            }
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
