<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Data + RA - Realidad Aumentada</title>
    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, sans-serif;
        }
        /* Forzar que el lienzo y el video ocupen exactamente el 100% de la pantalla sin deformarse */
        .a-canvas {
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
        }
        video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 0 !important;
        }
    </style>
</head>
<body class="text-white select-none">

    <!-- Interfaz de Guía Superior e Inferior -->
    <div class="absolute inset-0 z-20 pointer-events-none flex flex-col items-center justify-between p-6">
        
        <!-- Cabecera -->
        <div class="bg-gray-950/85 border border-cyan-500/40 backdrop-blur-md px-5 py-2.5 rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.3)] text-center pointer-events-auto">
            <h1 class="text-xs font-bold text-cyan-300 uppercase tracking-wider">Visor AR - Big Data</h1>
            <p class="text-[10px] text-gray-300 mt-0.5">Apunta la cámara hacia el marcador <strong>Hiro</strong></p>
        </div>

        <!-- Marco Central de Enfoque -->
        <div class="w-60 h-60 border-2 border-dashed border-cyan-400/60 rounded-3xl flex items-center justify-center bg-cyan-950/10 backdrop-blur-[1px] relative">
            <div class="w-4 h-4 border-t-2 border-l-2 border-cyan-400 absolute top-3 left-3"></div>
            <div class="w-4 h-4 border-t-2 border-r-2 border-cyan-400 absolute top-3 right-3"></div>
            <div class="w-4 h-4 border-b-2 border-l-2 border-cyan-400 absolute bottom-3 left-3"></div>
            <div class="w-4 h-4 border-b-2 border-r-2 border-cyan-400 absolute bottom-3 right-3"></div>
            <span class="text-[10px] text-cyan-300 uppercase tracking-widest bg-black/70 px-3 py-1 rounded-full border border-cyan-500/30">Buscando marcador...</span>
        </div>

        <!-- Pie de página -->
        <div class="text-[10px] text-gray-400 bg-black/70 px-4 py-1.5 rounded-full border border-gray-800 pointer-events-auto">
            Sistema activo • ISFT 182
        </div>
    </div>

    <!-- Escena AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
        
        <!-- Marcador Hiro -->
        <a-marker preset="hiro">
            
            <!-- Contenedor 3D de la Maqueta -->
            <a-entity position="0 0.5 0">
                <!-- Base de la maqueta -->
                <a-box position="0 0.2 0" depth="1.5" height="0.3" width="1.5" color="#0f172a" material="metalness: 0.8; roughness: 0.2; emissive: #0044aa; emissiveIntensity: 0.4;"></a-box>
                
                <!-- Servidores / Torres de datos -->
                <a-box position="-0.4 0.6 -0.4" depth="0.3" height="0.8" width="0.3" color="#00ffff"></a-box>
                <a-box position="0.4 0.6 -0.4" depth="0.3" height="0.8" width="0.3" color="#00ffff"></a-box>
                <a-box position="-0.4 0.6 0.4" depth="0.3" height="0.8" width="0.3" color="#3b82f6"></a-box>
                <a-box position="0.4 0.6 0.4" depth="0.3" height="0.8" width="0.3" color="#3b82f6"></a-box>

                <!-- Núcleo de Esfera Central Holográfica (Big Data) -->
                <a-sphere position="0 1.2 0" radius="0.45" color="#00ffff" material="wireframe: true; emissive: #00ffff; emissiveIntensity: 0.9;" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;"></a-sphere>

                <!-- Anillo orbital animado -->
                <a-torus position="0 1.2 0" radius="0.7" radius-tubular="0.015" rotation="65 0 0" color="#3b82f6" material="emissive: #3b82f6; emissiveIntensity: 0.8;" animation="property: rotation; to: 65 360 0; loop: true; dur: 5000; easing: linear;"></a-torus>

                <!-- Texto flotante -->
                <a-text value="BIG DATA + RA" position="-0.8 1.9 0" scale="0.6 0.6 0.6" color="#00ffff"></a-text>
            </a-entity>

        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
